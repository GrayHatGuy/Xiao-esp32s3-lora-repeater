; lw-frame-gen — standalone LoRaWAN (sync 0x34) test-frame generator for the
; v8.3 bench. Flash onto a spare Xiao ESP32-S3 + Wio-SX1262 (e.g. the COM6
; bridge, temporarily). It transmits on Radio 1 (the B2B-header radio).
; Build/upload from THIS folder:   pio run -t upload   then   pio device monitor
;
; Reflash the bridge firmware (`pio run -e xiao_esp32s3 -t upload` from the repo
; root) when you are done generating frames.
[env:xiao_esp32s3]
; Same pinned toolchain + RadioLib as the bridge, so setSyncWord(0x34) programs
; the identical SX126x register (0x3444) the DUT expects.
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib @ 7.7.0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
; --- RF profile: MUST match the DUT bridge's LoRaWAN radio EXACTLY or it will
;     not demodulate. Defaults = bench profile P-LW+MT, Radio 1 (freqA). For the
;     relay/flood pass point this at the DUT-A R1 freq (freqA), not freqB.
    -DGEN_FREQ_MHZ=904.6f
    -DGEN_BW_KHZ=125.0f
    -DGEN_SF=7
    -DGEN_CR=5
    -DGEN_TXP=20
; --- Optional hands-off auto-send: ms between frames (0 = manual serial/button).
    -DGEN_AUTO_MS=0

; Reticulum stimulus mode: sync 0x42 + the RNS RF plan (BW250/SF11), so the same
; FRAME-* bytes go out as generic 0x42 payloads for the RNS bench tests (C2 etc.).
; Build/upload:  pio run -e rns -t upload --upload-port COM6
[env:rns]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ 7.7.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGEN_SYNC=0x42
    -DGEN_FREQ_MHZ=914.875f
    -DGEN_BW_KHZ=250.0f
    -DGEN_SF=11
    -DGEN_CR=5
    -DGEN_TXP=20
    -DGEN_AUTO_MS=0

; A3 over-cap drop (fix #6): Custom sync 0xAB so the DUT logs the frame as proto=Custom
; and routes its raw bytes into the ABP encoder, where 250 B > the 242 B FRMPayload cap
; => evt=DROP drop=lw-payload-overflow. Set DUT Radio 1 = Custom matching freq/BW/SF/sync
; below, then send '6' in this monitor to fire FRAME-OVERSIZE.
; Build/upload:  pio run -e oversize -t upload --upload-port COM14
[env:oversize]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ 7.7.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGEN_SYNC=0xAB
    -DGEN_FREQ_MHZ=905.0f
    -DGEN_BW_KHZ=250.0f
    -DGEN_SF=7
    -DGEN_CR=5
    -DGEN_TXP=20
    -DGEN_AUTO_MS=0
