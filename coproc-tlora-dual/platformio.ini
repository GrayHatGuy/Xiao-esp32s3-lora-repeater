; T-Lora-Dual co-processor — drives the two LR1121 radios (R3/R4) for the XIAO
; quad bridge. Runs on the LilyGO T-Lora-Dual (ESP32 PICO-D4). Implements the
; UART slave side of ../src/LinkProtocol.h (the single shared wire-protocol
; header, included via the -I below so host and co-processor never drift).
;
; HAL precedence: the LR1121 pin map, RF-switch table, and begin()/config
; sequence are taken verbatim from the LilyGO T-Lora-Dual Factory example
; (the proven-working reference), not from the abandoned Wio-LR1121 driver.
;
; Build / flash this project on its own:  pio run -d coproc-tlora-dual -t upload

[env:tlora_dual_coproc]
platform  = espressif32 @ 6.13.0
board     = pico32
framework = arduino

lib_deps =
    jgromes/RadioLib @ 7.7.0

build_flags =
    -I ../src                 ; shared LinkProtocol.h (single source of truth)
    -DCORE_DEBUG_LEVEL=3

; Inter-board UART link to the XIAO host runs on UART0 (GPIO1 TX / GPIO3 RX) —
; the board's only exposed serial header (D1: GND / VDD 5V / TX / RX), which is
; also the flashing port. Baud default 460800 (src/main.cpp); override:
;    -DLINK_BAUD=460800
; Standalone bring-up on a USB-TTL dongle (plaintext logs instead of frames):
;    -DCOPROC_PLAINTEXT_DEBUG

monitor_speed = 115200
upload_speed  = 921600
