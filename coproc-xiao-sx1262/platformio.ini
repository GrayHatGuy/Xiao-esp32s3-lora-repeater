; Xiao dual-SX1262 radio CO-PROCESSOR (v8.5 "2xiao_4sx1262", stage E)
; ---------------------------------------------------------------------------
; Runs on the SECOND Xiao of a 2-board 4-radio bridge. Drives its two local
; SX1262 as the host's R3/R4 over the UART crossover, speaking the UART slave
; side of ../src/LinkProtocol.h (the single shared wire-protocol header, pulled
; in via -I ../src so host and co-processor never drift). It reuses the proven
; host SX1262 driver (../src/WioSX1262.cpp) rather than duplicating it.
;
; Wiring (crossed): this board's D6 (GPIO43, TX) -> host D7 (GPIO44, RX),
;                   this board's D7 (GPIO44, RX) <- host D6 (GPIO43, TX), GND-GND.
;
; Build / flash this project on its own (note the -d points at THIS folder):
;   pio run -d coproc-xiao-sx1262 -e xiao_coproc_sx1262 -t upload --upload-port COMx
; If this board's Radio-2 (edge) module silkscreen reads V1.1, build the V1.1 env.

[env:xiao_coproc_sx1262]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -I ../src                       ; shared LinkProtocol.h + WioSX1262.h + LoraRadio.h
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; UART link defaults (coproc_main.cpp): Serial1 TX=GPIO43(D6) / RX=GPIO44(D7)
    ; @ 460800. Override only if you wire a different UART.
    ;  -DLINK_TX_PIN=43
    ;  -DLINK_RX_PIN=44
    ;  -DLINK_BAUD=460800
    ; Echo LOG frames to USB-CDC too (standalone bring-up on a USB cable):
    ;  -DCOPROC_PLAINTEXT_DEBUG
; Keep this project's own src (coproc_main.cpp) AND reuse the host's SX1262
; driver from the parent src without duplicating it.
build_src_filter = +<*> +<../../src/WioSX1262.cpp>

; --- Radio-2 (edge) module is silkscreen V1.1 (NSS on D3/GPIO4) --------------
[env:xiao_coproc_sx1262_v1_1]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_coproc_sx1262.build_flags}
    -DWIO_SX1262_REV=11
build_src_filter = +<*> +<../../src/WioSX1262.cpp>
