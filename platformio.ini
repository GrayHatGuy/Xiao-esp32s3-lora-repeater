; PlatformIO project configuration
; XIAO ESP32S3 Dual SX1262 Crossover Bridge

[env:xiao_esp32s3]
; Pinned: the bridge is verified against Espressif32 6.13.0 (arduino-esp32
; 2.0.17). Leaving this unpinned lets a fresh checkout pull a newer core
; whose GPIO/SPI behaviour differs — keep it pinned for reproducible builds.
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino

; The bridge builds everything in src/ EXCEPT the OEM control test, which is a
; separate, self-contained environment (see [env:core1121_oem_rx] at the bottom).
build_src_filter = +<*> -<oem_rx/>

; RadioLib — SX126x + LR11x0 support. 7.7.0 has accumulated LR11x0 fixes
; since 7.0.0: image calibration on frequency change (7.1.0), IRQ map
; (7.3.0), RF switch table handling (7.1.0 + 7.7.0), HF/HP TX RF switching
; (7.7.0), packet offset in implicit mode (7.7.0). The 6.6.0 LR11x0 driver
; had a chip-detection bug on the Wio-LR1121 — v9.0 bumped to 7.0.0 and the
; LR11x0::begin() signature was adapted in WioLR1121.cpp. 7.7.0 keeps the
; same begin() signature, so the wrapper code is unchanged.
lib_deps =
    jgromes/RadioLib @ 7.7.0

; Enable verbose ESP-IDF logging over USB-CDC serial
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRADIOLIB_DEBUG_BASIC=1

; --- Core1121 (LR1121) diagnostic / bring-up flags ------------------------
; LR1121_DEBUG: emit per-call return-code logging from Core1121.cpp —
;   getErrors() after the RF-switch install, getIrqFlags() after begin, every
;   read/transmit/startReceive outcome, and re-arm warnings. Leave ON while
;   bringing the Core1121 up on the bench; delete this line for a quiet
;   production build once RX is confirmed.
    -DLR1121_DEBUG

; CORE1121_TCXO_RECAL: P2 RX-offset experiment (CLAUDE.md §0.9, CORE1121.md).
;   The Core1121 (LR1121) RX center is bench-confirmed LOW by >30 kHz at the
;   MeshCore BW62.5 config. When defined, Core1121::begin() re-issues
;   setTCXO + a full calibrate() once the 32 MHz TCXO is warm (sub-GHz only),
;   and logs the device error register before/after as a "[recal] ..." line.
;   DEFAULT OFF: leaving this commented makes begin() byte-for-byte the
;   baseline, so flag-on/flag-off is a clean one-variable A/B. Datasheet basis:
;   LR1121 DS §1.2.4 p.8 (POR calibration is skipped when a TCXO is fitted; the
;   host must reconfigure the TCXO and re-launch calibration) and UM v2.2 §3.6.1
;   p.32 (HF_XOSC_START_ERR remedy = SetTcxoMode + redo calibrations).
;   (Tested 2026-06-07: recal cleared the XOSC error flag but did NOT move the RX
;   center — the offset is a FIXED hardware reference error, so recal is OFF and
;   we correct the frequency directly via CORE1121_FREQ_OFFSET_HZ below.)
;    -DCORE1121_TCXO_RECAL
; CORE1121_TCXO_DELAY_US: SetTcxoMode startup-timeout argument in microseconds
;   (UM v2.2 §6.3.2 p.49; RadioLib converts to 30.52 us ticks). RadioLib default
;   is 5000 (~5 ms). Only the SECOND experiment variable — sweep it (e.g. 100000,
;   then 1000000) ONLY if CORE1121_TCXO_RECAL alone does not clear
;   HF_XOSC_START_ERR or move the nudge. One value per build.
;    -DCORE1121_TCXO_DELAY_US=5000

; CORE1121_FREQ_OFFSET_HZ: fixed sub-GHz carrier correction ADDED to every
;   frequency the Core1121 driver programs (RX LO + TX, Core1121.cpp:267-268).
;   This board's 32 MHz reference runs low, so the LR1121 lands below the
;   commanded frequency; commanding higher re-centers it. NOTE: this is added ON
;   TOP of the portal/NVS frequency, so during the fine sweep it must be 0 (else
;   a portal value of 910.545 is commanded as 910.545+offset). Read the actual
;   commanded freq off the "[Radio2-Edge] ready — <N> MHz ... (cfg <M> MHz,
;   offset +K Hz)" banner — <N> is what the chip is tuned to.
;   CORRECTION (2026-06-07): the prior comment claimed "R2 completed a packet at
;   +50 kHz" — that is FALSE. The RadioLib build never completed at +50 kHz
;   (CLAUDE.md §0.11: "+50 kHz preamble only"); the OEM Semtech driver completed
;   at +20 kHz / 910.545.
;   FINE-SWEEP IN PROGRESS (build-flag method): keep R2's stored freq at 910.525
;   (erase NVS once so loadDefaults restores 910.525, then leave it), and sweep
;   this flag 10000 -> 15000 -> 20000 -> 25000 = commanded 910.535/.540/.545/.550
;   (cfg stays 910.525; commanded = 910.525 + this). 20000 (=910.545) is the OEM's
;   winner. Restore to the winning value (or 0) after the sweep.
    -DCORE1121_FREQ_OFFSET_HZ=10000

; CORE1121_RSSI_CAL: program the LR1121's per-band RSSI/AGC gain-tune table at
;   begin() — the calibration RadioLib never sends but the OEM Semtech-driver
;   demo (and Seeed support) require. A wrong AGC gain can break demod even on
;   strong signals (LR1121 UM §7.2.15: "missed detection / packet loss"), a
;   candidate for R2 detecting preamble but never completing. Values = the OEM
;   600 MHz–2 GHz table (Core1121 demo lr1121_common.c). Default off; enabled
;   here for the bench A/B alongside the freq offset.
    -DCORE1121_RSSI_CAL

; Per-radio LoRa RF settings — configure each radio independently
; Call setRadioId(1) or setRadioId(2) before begin() to use these macros
; Or override per-radio settings in code with setLoraConfig()

; Radio 1 settings — MeshCore sub-GHz (matches the external Heltec V2 SX1262 source).
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
    -DLORA_RADIO1_FREQUENCY=910.525f
    -DLORA_RADIO1_BANDWIDTH=62.5f
    -DLORA_RADIO1_SPREAD_FACTOR=7
    -DLORA_RADIO1_CODING_RATE=5
    -DLORA_RADIO1_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO1_SYNC_WORD=0x12

; Radio 2 settings — Meshtastic LongFast sub-GHz on the Core1121 (LR1121).
;   Matches the external T3S3 LR1121 source (906.875 / BW250 / SF11 / CR4-5).
; NOTE: requested TX power was 30 dBm, but the LR1121 PA tops out at +22 dBm and
;   the compile-time check (LoraConfigCheck.h) rejects >22 — capped to 22 here.
;   (The Core1121 has no external PA, so 30 dBm is not achievable anyway.)
; R1=MeshCore (0x12) and R2=Meshtastic (0x2B) are DIFFERENT protocols, so the
;   same-protocol "two distinct channels" relay rule does not apply here.
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO2_FREQUENCY=906.875f
;    -DLORA_RADIO2_BANDWIDTH=250.0f
;    -DLORA_RADIO2_SPREAD_FACTOR=11
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=22
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO2_SYNC_WORD=0x12
    -DLORA_RADIO2_FREQUENCY=910.525f
    -DLORA_RADIO2_BANDWIDTH=62.5f
    -DLORA_RADIO2_SPREAD_FACTOR=7
    -DLORA_RADIO2_CODING_RATE=5
    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x2B
; R2_RX_ONLY_TEST is ON — R2 is pure-listen (the R1->R2 forward is gated off), for
; a clean R1-vs-R2 RX race on the same MeshCore channel. Delete the flag below to
; restore normal dual-radio R1<->R2 bridging.
    -DR2_RX_ONLY_TEST
; LR1121 2.4G Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO2_FREQUENCY=2404.46875f
;    -DLORA_RADIO2_BANDWIDTH=812.5f
;    -DLORA_RADIO2_SPREAD_FACTOR=11
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=10
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x2B

; defaulted to Meshtastic long/fast settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO1_FREQUENCY=906.875f
;    -DLORA_RADIO1_BANDWIDTH=250.0f
;    -DLORA_RADIO1_SPREAD_FACTOR=11
;    -DLORA_RADIO1_CODING_RATE=5
;    -DLORA_RADIO1_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO1_SYNC_WORD=0x2B

; defaulted to Meshcore settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO2_FREQUENCY=910.525f
;    -DLORA_RADIO2_BANDWIDTH=62.5f
;    -DLORA_RADIO2_SPREAD_FACTOR=7
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x12

; defaulted rnode settings
;    -DLORA_RADIO2_FREQUENCY=914.875f
;    -DLORA_RADIO2_BANDWIDTH=125.0f
;    -DLORA_RADIO2_SPREAD_FACTOR=8
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x42

; Global LoRa settings (applied to all radios):
;    -DLORA_PREAMBLE_LEN=8
;    -DLORA_CRC=1
;    -DLORA_TCXO_VOLTAGE=1.8f
;    -DLORA_MAX_PACKET=256

; Per-radio chip selection (MIXED build profile only — picks Radio 2's
; default chip; the portal "Radio 2 chip" select can override it at
; runtime). Values: RADIO_CHIP_SX1262 (0) / RADIO_CHIP_LR1121 (1).
; In the DUAL_SX1262 / DUAL_LR1121 profiles, chip is compile-locked and
; this flag is ignored.
    -DRADIO2_CHIP=RADIO_CHIP_LR1121

; Radio build profile. Exactly one of these may be defined; absence of both
; defaults to MIXED (Radio 1 = SX1262 fixed; Radio 2 portal-selectable
; SX1262/LR1121; both drivers linked).
;    -DRADIO_PROFILE_DUAL_SX1262    ; both radios SX1262, compile-locked
;    -DRADIO_PROFILE_DUAL_LR1121    ; both radios LR1121, compile-locked

; MeshCore channel selection. Default is the MeshCore public channel
; (hash 0x11). Override the key and display name to bridge a private/custom
; channel instead. KEY_HEX must be exactly 32 lowercase hex chars; the
; on-air channel-hash byte is derived from SHA-256(key)[0] at boot so you
; never have to compute it by hand.
    '-DBRIDGE_MC_KEY_HEX="8b3387e9c5cdea6ac9e5edbaa115cd72"'
    '-DBRIDGE_MC_CHANNEL_NAME="public"'

; Per-portnum bridging toggles for Meshtastic source. Both default ON; set
; to 0 to keep the corresponding traffic local to the MT mesh.
;    -DBRIDGE_MT_POSITION=1
;    -DBRIDGE_MT_TELEMETRY=1

; Meshtastic channel selection. Default is the LongFast public channel.
; Override to bridge a private/custom MT channel. PSK is the base64 string
; the Meshtastic app shows for the channel; blank == LongFast. It must
; decode to 1 byte (short key), 16 bytes (AES-128) or 32 bytes (AES-256).
; The on-air channel-hash byte is derived automatically at boot.
    '-DBRIDGE_MT_CHANNEL_NAME="LongFast"'
    '-DBRIDGE_MT_PSK_B64="AQ=="'

; RNS-source fragmentation tuning. Defaults baked into main.cpp (8 fragment
; cap, 2000 ms between MT fragments, 500 ms between MC fragments) are sized
; for SF11/BW250 MT + SF7/BW62.5 MC; uncomment and adjust if you change RF.
;    -DBRIDGE_RNS_MAX_FRAGS=8
;    -DBRIDGE_RNS_FRAG_DELAY_MT_MS=2000
;    -DBRIDGE_RNS_FRAG_DELAY_MC_MS=500

; Cross-protocol bridge identity (Meshtastic side).
; The numeric ID and string form MUST encode the same value:
;   "!b16b00b5" <-> 0xB16B00B5u
; String macros are single-quoted so values with spaces (e.g. "LoRa Bridge")
; survive shell tokenization unchanged.
    -DBRIDGE_MT_NODE_ID=0xB16B00B5u
    '-DBRIDGE_MT_NODE_ID_STR="!b16b00b5"' #32-bit hex with "!" prefix, as used in Meshtastic UI
    '-DBRIDGE_MT_LONG_NAME="B16B00B5 LoRa Bridge"' #long name for Meshtastic UI, max 23 chars
    '-DBRIDGE_MT_SHORT_NAME="BR"' #short name for Meshtastic UI, max 8 chars

; Upload & monitor
monitor_speed = 115200
upload_speed  = 921600


; ===========================================================================
; [env:core1121_oem_rx] — OEM CONTROL TEST (Semtech lr11xx_driver, NOT RadioLib)
; ---------------------------------------------------------------------------
; Drives the SAME physically-wired Core1121 (XIAO R2 slot) with WaveShare's/
; Semtech's official lr11xx_driver to receive the bench MeshCore traffic
; (910.525 / BW62.5 / SF7 / sync 0x12). It shares NOTHING with the bridge
; firmware: its own src (src/oem_rx/), its own vendored driver (lib/
; waveshare_lr1121/), no RadioLib. Decides RadioLib-usage vs chip:
;   RX_DONE here (where the RadioLib build only reaches preamble) => the deficit
;   is RadioLib's LR1121 path, and the fix is to drive R2 with this driver.
; Flash:  pio run -e core1121_oem_rx -t erase -t upload -t monitor
; (Pins are remapped to our R2 wiring in lib/waveshare_lr1121/wavesahre_lora_1121.h.)
; ===========================================================================
[env:core1121_oem_rx]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino

; Only the OEM test sources compile in this env; the bridge src is excluded.
build_src_filter = -<*> +<oem_rx/>
; Vendored Semtech driver lives in lib/waveshare_lr1121 with nested includes —
; scan deeply so all 90 files + their internal includes resolve.
lib_ldf_mode = deep+

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed  = 921600

; ===========================================================================
; [env:xiao_esp32s3_colink_test] — PATH B MILESTONE 0 — co-link smoke test
; ---------------------------------------------------------------------------
; Compiles BOTH RadioLib (R1 / Wio-SX1262, in src/colink_test/main.cpp) AND the
; vendored Semtech lr11xx_driver (R2 / Core1121-LR1121, in src/colink_test/
; semtech_r2.cpp) into ONE binary, to prove they link + share one SPI bus / one
; FreeRTOS mutex before any real Path B porting. Only src/colink_test/ compiles;
; the bridge and OEM sources are excluded. The two driver stacks live in separate
; translation units, so a clean link IS the co-link proof; flashing then proves
; the runtime SPI/mutex sharing (both chips answer, 0 errors, no deadlock).
; Build/flash:  pio run -e xiao_esp32s3_colink_test -t upload -t monitor
; ===========================================================================
[env:xiao_esp32s3_colink_test]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino

; Only the co-link test compiles; bridge + OEM sources excluded.
build_src_filter = -<*> +<colink_test/>
; deep+ so the vendored 90-file Semtech tree (lib/waveshare_lr1121) resolves,
; alongside RadioLib from lib_deps.
lib_ldf_mode = deep+
lib_deps =
    jgromes/RadioLib @ 7.7.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_SEMTECH_COLINK_TEST

monitor_speed = 115200
upload_speed  = 921600
