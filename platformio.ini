; PlatformIO project configuration
; XIAO ESP32S3 Dual SX1262 Crossover Bridge

[env:xiao_esp32s3]
; Pinned: the bridge is verified against Espressif32 6.13.0 (arduino-esp32
; 2.0.17). Leaving this unpinned lets a fresh checkout pull a newer core
; whose GPIO/SPI behaviour differs — keep it pinned for reproducible builds.
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino

; RadioLib — SX126x + LR11x0 support. 7.7.0 has accumulated LR11x0 fixes
; since 7.0.0: image calibration on frequency change (7.1.0), IRQ map
; (7.3.0), RF switch table handling (7.1.0 + 7.7.0), HF/HP TX RF switching
; (7.7.0), packet offset in implicit mode (7.7.0). The 6.6.0 LR11x0 driver
; had a chip-detection bug on the Wio-LR1121 — v9.0 bumped to 7.0.0 and the
; LR11x0::begin() signature was adapted in WioLR1121.cpp. 7.7.0 keeps the
; same begin() signature, so the wrapper code is unchanged.
lib_deps =
    jgromes/RadioLib @ 7.7.0

; Enable verbose ESP-IDF logging over USB-CDC serial
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRADIOLIB_DEBUG_BASIC=1

; --- Wio-LR1121 diagnostic / bring-up flags --------------------------------
; LR1121_DEBUG: emit per-call return-code logging from WioLR1121.cpp —
;   getIrqFlags after begin, every read/transmit/startReceive outcome, and
;   re-arm warnings. Leave ON while the Wio-LR1121 RX block is under
;   investigation (Phase 1 known-issue); delete this line for a quiet
;   production build once RX is resolved.
    -DLR1121_DEBUG
; LR1121_BRUTEFORCE_RX_DIOMASK: override MODE_RX entry of the LR1121 RF
;   switch table. 5-bit encoding covering all chip RFSWx outputs per LR1121
;   user manual §4.5.2:
;       bit 0 → DIO5  (RFSW0)
;       bit 1 → DIO6  (RFSW1)
;       bit 2 → DIO7  (RFSW2)
;       bit 3 → DIO8  (RFSW3)
;       bit 4 → DIO10 (RFSW4)
;   (DIO11 is not in RadioLib's RFSWx mapping; not testable via this flag.)
;
;   Values 0..7 (DIO5/6/7 only) swept on 2026-05-26 — all identical failure.
;   See LR1121-SPEC.md "Brute-force MODE_RX DIO sweep — RESULTS".
;
;   Extended sweep adds DIO8 and DIO10 as candidates (the Wio-LR1121's
;   integrated TCXO frees DIO10 from 32k-crystal use). Highest-value
;   targeted tests:
;       8  = 01000 (DIO8 HIGH only — RFSW3)
;       16 = 10000 (DIO10 HIGH only — RFSW4)
;       24 = 11000 (DIO8 + DIO10 — most likely if module uses RFSW3+RFSW4
;                    per Semtech multi-band reference design)
;       25 = 11001 (T3S3-DIO5 + DIO8 + DIO10)
;       31 = 11111 (all 5 HIGH — catch-all)
;
;   Walk one combo at a time, rebuild + flash + 1-minute bench test, look
;   for `[Radio2-Edge] read: pktLen=N>0` from real OTA traffic (NOT the
;   post-TX spurious pktLen=0 ones). If any of these produces real RX,
;   we've found the Wio-LR1121's switch wiring.
; Extended 5-bit sweep complete 2026-05-26: 0..7 + 8 + 16 + 24 + 31 all
; failed identically. See LR1121-SPEC.md. Flag commented-out; if a future
; bench session wants to test a specific value again, set it here.
;    -DLR1121_BRUTEFORCE_RX_DIOMASK=1

; LR1121_RX_AUDIT_RUN: select which DOE row in LR1121-RX-INIT-AUDIT.md to
;   execute for the Phase-1 RX bring-up bench session. Walk this value
;   sequentially 0..5 across runs and record results per the table below
;   into LR1121-RX-INIT-AUDIT.md.
;
;   Run | Treatments applied
;   ----+----------------------------------------------------------------
;     0 | Baseline (no extra treatments) + getErrors() diagnostic only.
;       | Establishes reference: confirms self-echo pattern at known
;       | RSSI and provides first getErrors() reading. If errors != 0
;       | here, the entire 12-iteration RFSWx sweep evidence is
;       | invalidated -- proceed to Run 1 immediately to verify fix.
;     1 | + pre-standby(STBY_RC) before setRfSwitchTable.
;       | Per UM v2.2 §4.2.1 SetDioAsRfSwitch returns CMD_FAIL if not
;       | in STBY_RC. RadioLib's setRfSwitchTable discards the return
;       | value, so any silent failure would be invisible. This run
;       | forces STBY_RC explicitly.
;     2 | + setRssiCalibration with UM v2.2 Table 7-21 "From 600 MHz to
;       | 2 GHz" reference tunes.  TOP CANDIDATE per UM §7.2.15:
;       | chip ships calibrated for LR1121 EVK, not the Wio-LR1121
;       | matching network -- wrong calibration -> wrong AGC LNA gain
;       | -> "missed detection (packet loss)" (UM verbatim).
;     3 | + calibrateImageRejection(902, 928) for US sub-GHz ISM band.
;       | Per UM §2.1.3 POR image cal "fails" on chips with TCXO
;       | fitted (Wio-LR1121 has integrated TCXO), so explicit re-cal
;       | may be needed.
;     4 | + setRxBoostedGainMode(true). Small ~2 dB benefit per UM
;       | §7.2.12 -- not expected to solve alone but worth ruling in.
;     5 | Kitchen-sink: all of 1+2+3+4 combined.
;     6 | "Meshtastic-style" — mirrors stock Meshtastic firmware's working
;       | LR1121 path (proven on LilyGO T3S3 LR1121, same bench):
;       |   - Switch table declares only DIO5 + DIO6 (DIO7/8/10 = NC)
;       |   - setRegulatorDCDC() after begin() (RadioLib default is LDO)
;       |   - setPreambleLength() before every startReceive(),
;       |     per Meshtastic's undocumented "Solve RX ack fail" workaround
;       |   - setRxBoostedGainMode stays OFF (Meshtastic default)
;       | These three deltas are board-layout-INDEPENDENT (LilyGO T3S3 vs
;       | Seeed Wio-LR1121 switch wiring may differ but DCDC + preamble
;       | length + NC-pin policy are universal). Final firmware-side
;       | sanity check before declaring the Wio module a hardware fault.
;
;   Pass criterion (any run): [Radio2-Edge] read: pktLen=N>0 from real
;   OTA traffic (NOT post-TX spurious pktLen=0 events).
;   Default: 0 (baseline + getErrors() diagnostic only).
; Baseline + getErrors() diagnostic only. Run 8 (2026-05-28, AUDIT_RUN=6)
; bench-tested the Meshtastic-style stack (setRegulatorDCDC + per-arm
; setPreambleLength) on top of the Seeed-authoritative locked switch table —
; both treatments confirmed inert. All firmware-side hypotheses now exhausted;
; see LR1121-RX-INIT-AUDIT.md Run 8 conclusion. Application firmware paused
; pending Seeed engineering reply.
    -DLR1121_RX_AUDIT_RUN=0

; Per-radio LoRa RF settings — configure each radio independently
; Call setRadioId(1) or setRadioId(2) before begin() to use these macros
; Or override per-radio settings in code with setLoraConfig()

; Radio 1 settings:
; defaulted to Meshtastic long/fast settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
    -DLORA_RADIO1_FREQUENCY=906.875f
    -DLORA_RADIO1_BANDWIDTH=250.0f
    -DLORA_RADIO1_SPREAD_FACTOR=11
    -DLORA_RADIO1_CODING_RATE=5
    -DLORA_RADIO1_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO1_SYNC_WORD=0x2B

; Radio 2 settings:
; 2026-05-28: defaulted to Meshtastic LongFast (matches Radio 1 modem params)
;   for the HACKRF-DIAGNOSTIC-PLAN.md Test 0a sub-GHz baseline re-verification
;   against the T3S3 LR1121 reference radio. Prior MeshCore defaults preserved
;   in the commented block below.
;
; IMPORTANT RUNTIME CAVEAT: with these defaults, R1 and R2 modem params are
;   identical, so the CaptivePortal same-protocol rules checker (see
;   CaptivePortal.cpp:641 "Same-protocol relay must be between two DIFFERENT
;   channels") will drop packets at runtime UNLESS R2 is configured via the
;   captive portal NVS to use a distinct Meshtastic channel name (e.g.
;   "longfast2") whose channel hash differs from R1's "LongFast" (0x08).
;   Verify in the boot log that two distinct [MT] channel lines appear with
;   different hashes before trusting Test 0a results.
;
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
    -DLORA_RADIO2_FREQUENCY=906.875f
    -DLORA_RADIO2_BANDWIDTH=250.0f
    -DLORA_RADIO2_SPREAD_FACTOR=11
    -DLORA_RADIO2_CODING_RATE=5
    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO2_SYNC_WORD=0x2B

; LR1121 2.4G Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO2_FREQUENCY=2404.46875f
;    -DLORA_RADIO2_BANDWIDTH=812.5f
;    -DLORA_RADIO2_SPREAD_FACTOR=11
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=10
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x2B

; defaulted to Meshtastic long/fast settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO1_FREQUENCY=906.875f
;    -DLORA_RADIO1_BANDWIDTH=250.0f
;    -DLORA_RADIO1_SPREAD_FACTOR=11
;    -DLORA_RADIO1_CODING_RATE=5
;    -DLORA_RADIO1_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO1_SYNC_WORD=0x2B

; defaulted to Meshcore settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO2_FREQUENCY=910.525f
;    -DLORA_RADIO2_BANDWIDTH=62.5f
;    -DLORA_RADIO2_SPREAD_FACTOR=7
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x12

; defaulted rnode settings
;    -DLORA_RADIO2_FREQUENCY=914.875f
;    -DLORA_RADIO2_BANDWIDTH=125.0f
;    -DLORA_RADIO2_SPREAD_FACTOR=8
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x42

; --- Radio 3 / Radio 4 (T-Lora-Dual LR1121, remote over UART) ---------------
; R3/R4 live on the LilyGO T-Lora-Dual co-processor, reached over the UART link
; below. They default to disabled (PROTO_NONE); enable + configure them in the
; captive portal. These flags only seed first-boot RF for an enabled slot.
;    -DLORA_RADIO3_FREQUENCY=906.875f
;    -DLORA_RADIO3_BANDWIDTH=250.0f
;    -DLORA_RADIO3_SPREAD_FACTOR=11
;    -DLORA_RADIO3_CODING_RATE=5
;    -DLORA_RADIO3_TX_POWER=20
;    -DLORA_RADIO3_SYNC_WORD=0x2B
;    -DLORA_RADIO4_FREQUENCY=910.525f
;    -DLORA_RADIO4_BANDWIDTH=250.0f
;    -DLORA_RADIO4_SPREAD_FACTOR=11
;    -DLORA_RADIO4_CODING_RATE=5
;    -DLORA_RADIO4_TX_POWER=20
;    -DLORA_RADIO4_SYNC_WORD=0x12

; Inter-board UART link to the T-Lora-Dual co-processor. Defaults (main.cpp):
; XIAO UART1 TX=GPIO43 (D6) / RX=GPIO44 (D7) @ 460800 baud. VERIFY vs wiring.
;    -DBRIDGE_LINK_TX_PIN=43
;    -DBRIDGE_LINK_RX_PIN=44
;    -DBRIDGE_LINK_BAUD=460800

; ===========================================================================
; EXAMPLE: 4-radio sub-GHz bench profile (first bring-up, no 2.4 GHz)
; ---------------------------------------------------------------------------
; A known-good starting point to exercise all four radios on sub-GHz before
; touching 2.4 GHz. These are mostly CAPTIVE-PORTAL settings: R3/R4 enable,
; per-radio channels, and the routing matrix are portal-only (build flags can't
; enable a remote radio or set routeMask). Enter them in the portal after flash.
;
; Region US (902-928). FOUR DISTINCT frequencies so the co-located radios don't
; co-channel each other — note MT public & private otherwise compute the SAME
; slot (freq derives from the modem-preset name, not the channel name), so the
; MT freq field MUST be overridden for R2:
;
;   Radio  Proto  Band     Freq(MHz)  Channel             Sync  Bridge RX to
;   -----  -----  -------  ---------  ------------------  ----  ------------
;   R1     MT     sub-GHz  906.875    LongFast (public)   0x2B  R3
;   R2     MT     sub-GHz  916.000    <private> + PSK     0x2B  R4
;   R3     MC     sub-GHz  921.000    public              0x12  R1
;   R4     MC     sub-GHz  924.000    <private> 32-hex    0x12  R2
;
;   - Override R2's frequency to 916.0 by hand (both LongFast presets land on
;     the same slot otherwise = two co-located radios on one channel).
;   - Set R3/R4 BW/SF/CR to match your real MeshCore community's RF.
;   - Bench: use LOW TX power (~5-10 dBm) and spread the antennas; connect all
;     four antennas before power-on.
;   - Routing: R1<->R3 (MT/MC public), R2<->R4 (MT/MC private). Do NOT bridge
;     R1<->R2 or R3<->R4 — that leaks public <-> private traffic.
;   - Bring up incrementally: confirm "[coproc] READY" + cfg logs on the host
;     serial, then R3 alone, then R4, then enable the full matrix.
;
; The R1/R2 LORA_RADIO1/2_* flags above DO seed first boot; to pre-seed R3/R4
; RF for a source build, uncomment the LORA_RADIO3/4_* block above (R3/R4 still
; start disabled until enabled in the portal).
; ===========================================================================

; Global LoRa settings (applied to all radios):
;    -DLORA_PREAMBLE_LEN=8
;    -DLORA_CRC=1
;    -DLORA_TCXO_VOLTAGE=1.8f
;    -DLORA_MAX_PACKET=256

; Per-radio chip selection (MIXED build profile only — picks Radio 2's
; default chip; the portal "Radio 2 chip" select can override it at
; runtime). Values: RADIO_CHIP_SX1262 (0) / RADIO_CHIP_LR1121 (1).
; In the DUAL_SX1262 / DUAL_LR1121 profiles, chip is compile-locked and
; this flag is ignored.
;    -DRADIO2_CHIP=RADIO_CHIP_LR1121

; Radio build profile. Exactly one of these may be defined; absence of both
; defaults to MIXED (Radio 1 = SX1262 fixed; Radio 2 portal-selectable
; SX1262/LR1121; both drivers linked).
;    -DRADIO_PROFILE_DUAL_SX1262    ; both radios SX1262, compile-locked
;    -DRADIO_PROFILE_DUAL_LR1121    ; both radios LR1121, compile-locked

; MeshCore channel selection. Default is the MeshCore public channel
; (hash 0x11). Override the key and display name to bridge a private/custom
; channel instead. KEY_HEX must be exactly 32 lowercase hex chars; the
; on-air channel-hash byte is derived from SHA-256(key)[0] at boot so you
; never have to compute it by hand.
;    '-DBRIDGE_MC_KEY_HEX="8b3387e9c5cdea6ac9e5edbaa115cd72"'
;    '-DBRIDGE_MC_CHANNEL_NAME="public"'

; Per-portnum bridging toggles for Meshtastic source. Both default ON; set
; to 0 to keep the corresponding traffic local to the MT mesh.
;    -DBRIDGE_MT_POSITION=1
;    -DBRIDGE_MT_TELEMETRY=1

; Meshtastic channel selection. Default is the LongFast public channel.
; Override to bridge a private/custom MT channel. PSK is the base64 string
; the Meshtastic app shows for the channel; blank == LongFast. It must
; decode to 1 byte (short key), 16 bytes (AES-128) or 32 bytes (AES-256).
; The on-air channel-hash byte is derived automatically at boot.
;    '-DBRIDGE_MT_CHANNEL_NAME="LongFast"'
;    '-DBRIDGE_MT_PSK_B64="AQ=="'

; RNS-source fragmentation tuning. Defaults baked into main.cpp (8 fragment
; cap, 2000 ms between MT fragments, 500 ms between MC fragments) are sized
; for SF11/BW250 MT + SF7/BW62.5 MC; uncomment and adjust if you change RF.
;    -DBRIDGE_RNS_MAX_FRAGS=8
;    -DBRIDGE_RNS_FRAG_DELAY_MT_MS=2000
;    -DBRIDGE_RNS_FRAG_DELAY_MC_MS=500

; Cross-protocol bridge identity (Meshtastic side).
; The numeric ID and string form MUST encode the same value:
;   "!b16b00b5" <-> 0xB16B00B5u
; String macros are single-quoted so values with spaces (e.g. "LoRa Bridge")
; survive shell tokenization unchanged.
    -DBRIDGE_MT_NODE_ID=0xB16B00B5u
    '-DBRIDGE_MT_NODE_ID_STR="!b16b00b5"' #32-bit hex with "!" prefix, as used in Meshtastic UI
    '-DBRIDGE_MT_LONG_NAME="B16B00B5 LoRa Bridge"' #long name for Meshtastic UI, max 23 chars
    '-DBRIDGE_MT_SHORT_NAME="BR"' #short name for Meshtastic UI, max 8 chars

; Upload & monitor
monitor_speed = 115200
upload_speed  = 921600
