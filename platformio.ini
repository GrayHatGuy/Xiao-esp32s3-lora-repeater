; ===========================================================================
; LoRaCam MULTI-HOP bench (commander -> repeater -> cam), proven on a 3-board
; frequency-split rig so the cam is reachable ONLY via the repeater:
;   freqA = 905.0  (commander <-> repeater R1)   freqB = 906.875 (repeater R2 <-> cam)
; The cam stays on the standard bench_camc2 (906.875) — no cam change. Flash:
;   commander (quad-rig host) -> bench_camc2_cmdr_905   (its R2 moved to 905.0)
;   repeater  (a dual-SX1262 XIAO bridge) -> bench_repeater_custom
;   cam -> bench_camc2  (unchanged, 906.875)
; ---------------------------------------------------------------------------
; The REPEATER: a PLAIN bridge (no camera/commander role) that raw-repeats Custom
; 0x33 frames R1<->R2 (BRIDGE_CUSTOM_REPEAT). Both radios share the Custom channel
; name "loracam" so sameChannel() is true across the two frequencies; routeMask
; bridges R1->R2 (0x2) and R2->R1 (0x1) for the command + ACK directions.
