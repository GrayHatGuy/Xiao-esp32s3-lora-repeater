; ===========================================================================
; LoRaCam — camera node (XIAO ESP32-S3 Sense + perimeter Wio-SX1262 edge radio)
; ---------------------------------------------------------------------------
; A LoRa-commanded camera built on the bridge firmware. R1 (the B2B-connector
; radio, GPIO38-42) is DISABLED because those pins are the Sense camera/mic; the
; single edge radio R2 carries an encrypted, sender-whitelisted Custom (sync
; 0x33) command-and-control channel. The camera/SD/web subsystems are added in
; later phases, all gated behind -DBRIDGE_ROLE_CAMERA so the stock bridge builds
; (xiao_esp32s3 / _v1_1 / coproc) stay byte-identical (do-no-harm, like
; BRIDGE_LW_ENCODE). No `extends` — reference base flags once via ${...}, trailing
; -D overrides win. Phase 1 = C2 over LoRa, no camera yet; bench env = bench_camc2.
; (V1.0 edge module; for a V1.1 module add -DWIO_SX1262_REV=11.)
[env:xiao_loracam]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_ROLE_CAMERA=1
    -DLORA_RADIO1_DISABLE                 ; B2B radio off — its pins (GPIO38-42) are the camera/mic
    ; R2 = the LoRaCam C2 radio (edge Wio-SX1262): Custom binary command channel.
    -DLORA_RADIO2_SYNC_WORD=0x33          ; PROTO_CUSTOM (not 0x12 MC / 0x2B MT / 0x42 RNS / 0x34 LW)
    -DLORA_RADIO2_FREQUENCY=906.875f
    -DLORA_RADIO2_BANDWIDTH=250.0f
    -DLORA_RADIO2_SPREAD_FACTOR=9         ; range/airtime balance; stays under US915 400 ms dwell
    -DLORA_RADIO2_CODING_RATE=5
    -DLORA_RADIO2_TX_POWER=20             ; handoff §8 ceiling on the 3V3 rail (not 22)
    ; Phase 3 portal (always-on WPA2 SoftAP + login). These are FIRST-BOOT DEFAULTS
    ; only — change them in the portal's Security page (then they persist to NVS).
    '-DBRIDGE_PORTAL_USER="admin"'
    '-DBRIDGE_PORTAL_PASS="loracam-admin"'
    '-DBRIDGE_PORTAL_AP_PASS="loracam-portal"'

; --- LoRaCam BENCH: same as xiao_loracam but AUTO-SAVES the config on an ERASED
; board (no captive portal), so it boots straight into the LoRaCam radio config
; (R1 disabled, R2 = Custom 0x33). Switching a board FROM another saved config
; needs an erase first (autosave only acts on an unconfigured board):
