; --- R5 same-channel MT raw-repeat: BOTH radios Meshtastic LongFast, two freqs.
; R1 stays base default (MT 906.875/BW250/SF11/0x2B). R2 forced to MT 0x2B @905.0.
; radioDefaultChannel(0x2B) sets each MT radio's channel to LongFast + blank PSK
; (BridgeConfig.cpp:180-182), so both share channelHash 0x08 -> sameChannel()=true
; -> an MT frame on R1 is raw-repeated to R2 (mode=raw, sender id preserved). No
; 'extends' (see warning above); reference base flags once, trailing -D overrides win.
[env:bench_mt_samechan]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DLORA_RADIO2_SYNC_WORD=0x2B
    -DLORA_RADIO2_FREQUENCY=905.0f
    -DLORA_RADIO2_BANDWIDTH=250.0f
    -DLORA_RADIO2_SPREAD_FACTOR=11
