; PlatformIO project configuration
; XIAO ESP32S3 Dual SX1262 Crossover Bridge

[env:xiao_esp32s3]
; Pinned: the bridge is verified against Espressif32 6.13.0 (arduino-esp32
; 2.0.17). Leaving this unpinned lets a fresh checkout pull a newer core
; whose GPIO/SPI behaviour differs — keep it pinned for reproducible builds.
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino

; RadioLib — SX126x + LR11x0 support. 7.7.0 has accumulated LR11x0 fixes
; since 7.0.0: image calibration on frequency change (7.1.0), IRQ map
; (7.3.0), RF switch table handling (7.1.0 + 7.7.0), HF/HP TX RF switching
; (7.7.0), packet offset in implicit mode (7.7.0). The 6.6.0 LR11x0 driver
; had a chip-detection bug on the Wio-LR1121 — v9.0 bumped to 7.0.0 and the
; LR11x0::begin() signature was adapted in WioLR1121.cpp. 7.7.0 keeps the
; same begin() signature, so the wrapper code is unchanged.
lib_deps =
    jgromes/RadioLib @ 7.7.0

; Enable verbose ESP-IDF logging over USB-CDC serial
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRADIOLIB_DEBUG_BASIC=1

; --- Wio-LR1121 diagnostic / bring-up flags --------------------------------
; LR1121_DEBUG: emit per-call return-code logging from WioLR1121.cpp —
;   getIrqFlags after begin, every read/transmit/startReceive outcome, and
;   re-arm warnings. Leave ON while the Wio-LR1121 RX block is under
;   investigation (Phase 1 known-issue); delete this line for a quiet
;   production build once RX is resolved.
    -DLR1121_DEBUG
; LR1121_BRUTEFORCE_RX_DIOMASK: override MODE_RX entry of the LR1121 RF
;   switch table. Encoding:
;       bit 0 → DIO5, bit 1 → DIO6, bit 2 → DIO7
;   Values:
;       0 = 000  (femtofox: passive RX, all LOW)
;       1 = 001  (LilyGO T3S3 production: DIO5 HIGH)  [DEFAULT]
;       2 = 010  (DIO6 HIGH — same as MODE_TX, unusual but worth testing)
;       3 = 011  (DIO5+DIO6 HIGH)
;       4 = 100  (DIO7 HIGH)
;       5 = 101  (DIO5+DIO7 HIGH)
;       6 = 110  (DIO6+DIO7 HIGH)
;       7 = 111  (all three HIGH)
;   When the Wio-LR1121 RX doesn't produce RX_DONE events under the chosen
;   value, change this to the next number, rebuild, flash, and bench-test —
;   one ~1-minute build per state, 8 states total. If none produces real
;   `[Radio2-Edge] read: pktLen=N>0` lines, the LNA path is conclusively
;   hardware-broken and the module is unfit for RX.
; All 8 values 0..7 swept on 2026-05-26 with identical-failure result —
; see LR1121-SPEC.md "Brute-force MODE_RX DIO sweep — RESULTS". Switch
; state is conclusively irrelevant to RX on the Wio-LR1121. Leaving this
; flag commented-out (T3S3 default value 1 is compiled in if absent).
;    -DLR1121_BRUTEFORCE_RX_DIOMASK=1

; Per-radio LoRa RF settings — configure each radio independently
; Call setRadioId(1) or setRadioId(2) before begin() to use these macros
; Or override per-radio settings in code with setLoraConfig()

; Radio 1 settings:
; defaulted to Meshtastic long/fast settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
    -DLORA_RADIO1_FREQUENCY=906.875f
    -DLORA_RADIO1_BANDWIDTH=250.0f
    -DLORA_RADIO1_SPREAD_FACTOR=11
    -DLORA_RADIO1_CODING_RATE=5
    -DLORA_RADIO1_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO1_SYNC_WORD=0x2B

; Radio 2 settings:
; defaulted to Meshcore settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
    -DLORA_RADIO2_FREQUENCY=910.525f
    -DLORA_RADIO2_BANDWIDTH=62.5f
    -DLORA_RADIO2_SPREAD_FACTOR=7
    -DLORA_RADIO2_CODING_RATE=5
    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO2_SYNC_WORD=0x12

; defaulted to Meshtastic long/fast settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO1_FREQUENCY=906.875f
;    -DLORA_RADIO1_BANDWIDTH=250.0f
;    -DLORA_RADIO1_SPREAD_FACTOR=11
;    -DLORA_RADIO1_CODING_RATE=5
;    -DLORA_RADIO1_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO1_SYNC_WORD=0x2B

; defaulted to Meshcore settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO2_FREQUENCY=910.525f
;    -DLORA_RADIO2_BANDWIDTH=62.5f
;    -DLORA_RADIO2_SPREAD_FACTOR=7
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x12

; defaulted rnode settings
;    -DLORA_RADIO2_FREQUENCY=914.875f
;    -DLORA_RADIO2_BANDWIDTH=125.0f
;    -DLORA_RADIO2_SPREAD_FACTOR=8
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x42

; Global LoRa settings (applied to all radios):
;    -DLORA_PREAMBLE_LEN=8
;    -DLORA_CRC=1
;    -DLORA_TCXO_VOLTAGE=1.8f
;    -DLORA_MAX_PACKET=256

; Per-radio chip selection (MIXED build profile only — picks Radio 2's
; default chip; the portal "Radio 2 chip" select can override it at
; runtime). Values: RADIO_CHIP_SX1262 (0) / RADIO_CHIP_LR1121 (1).
; In the DUAL_SX1262 / DUAL_LR1121 profiles, chip is compile-locked and
; this flag is ignored.
;    -DRADIO2_CHIP=RADIO_CHIP_LR1121

; Radio build profile. Exactly one of these may be defined; absence of both
; defaults to MIXED (Radio 1 = SX1262 fixed; Radio 2 portal-selectable
; SX1262/LR1121; both drivers linked).
;    -DRADIO_PROFILE_DUAL_SX1262    ; both radios SX1262, compile-locked
;    -DRADIO_PROFILE_DUAL_LR1121    ; both radios LR1121, compile-locked

; MeshCore channel selection. Default is the MeshCore public channel
; (hash 0x11). Override the key and display name to bridge a private/custom
; channel instead. KEY_HEX must be exactly 32 lowercase hex chars; the
; on-air channel-hash byte is derived from SHA-256(key)[0] at boot so you
; never have to compute it by hand.
;    '-DBRIDGE_MC_KEY_HEX="8b3387e9c5cdea6ac9e5edbaa115cd72"'
;    '-DBRIDGE_MC_CHANNEL_NAME="public"'

; Per-portnum bridging toggles for Meshtastic source. Both default ON; set
; to 0 to keep the corresponding traffic local to the MT mesh.
;    -DBRIDGE_MT_POSITION=1
;    -DBRIDGE_MT_TELEMETRY=1

; Meshtastic channel selection. Default is the LongFast public channel.
; Override to bridge a private/custom MT channel. PSK is the base64 string
; the Meshtastic app shows for the channel; blank == LongFast. It must
; decode to 1 byte (short key), 16 bytes (AES-128) or 32 bytes (AES-256).
; The on-air channel-hash byte is derived automatically at boot.
;    '-DBRIDGE_MT_CHANNEL_NAME="LongFast"'
;    '-DBRIDGE_MT_PSK_B64="AQ=="'

; RNS-source fragmentation tuning. Defaults baked into main.cpp (8 fragment
; cap, 2000 ms between MT fragments, 500 ms between MC fragments) are sized
; for SF11/BW250 MT + SF7/BW62.5 MC; uncomment and adjust if you change RF.
;    -DBRIDGE_RNS_MAX_FRAGS=8
;    -DBRIDGE_RNS_FRAG_DELAY_MT_MS=2000
;    -DBRIDGE_RNS_FRAG_DELAY_MC_MS=500

; Cross-protocol bridge identity (Meshtastic side).
; The numeric ID and string form MUST encode the same value:
;   "!b16b00b5" <-> 0xB16B00B5u
; String macros are single-quoted so values with spaces (e.g. "LoRa Bridge")
; survive shell tokenization unchanged.
    -DBRIDGE_MT_NODE_ID=0xB16B00B5u
    '-DBRIDGE_MT_NODE_ID_STR="!b16b00b5"' #32-bit hex with "!" prefix, as used in Meshtastic UI
    '-DBRIDGE_MT_LONG_NAME="B16B00B5 LoRa Bridge"' #long name for Meshtastic UI, max 23 chars
    '-DBRIDGE_MT_SHORT_NAME="BR"' #short name for Meshtastic UI, max 8 chars

; Upload & monitor
monitor_speed = 115200
upload_speed  = 921600
