; PlatformIO project configuration
; XIAO ESP32S3 Dual SX1262 Crossover Bridge

[env:xiao_esp32s3]
; Pinned: the bridge is verified against Espressif32 6.13.0 (arduino-esp32
; 2.0.17). Leaving this unpinned lets a fresh checkout pull a newer core
; whose GPIO/SPI behaviour differs — keep it pinned for reproducible builds.
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino

; RadioLib — SX1262 support. Pinned 7.7.0 for v8.2: this is the version the
; RX-priority TX/CAD path (scanChannel/startTransmit/finishTransmit) was
; developed and bench-validated against on the SX1262 (the LR11x0 RX deficit
; on 7.7.0 does not affect the SX126x path used here).
lib_deps =
    jgromes/RadioLib @ 7.7.0

; Enable verbose ESP-IDF logging over USB-CDC serial
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRADIOLIB_DEBUG_BASIC=1

; Per-radio LoRa RF settings — configure each radio independently
; Call setRadioId(1) or setRadioId(2) before begin() to use these macros
; Or override per-radio settings in code with setLoraConfig()

; Radio 1 settings:
; defaulted to Meshtastic long/fast settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
    -DLORA_RADIO1_FREQUENCY=906.875f
    -DLORA_RADIO1_BANDWIDTH=250.0f
    -DLORA_RADIO1_SPREAD_FACTOR=11
    -DLORA_RADIO1_CODING_RATE=5
    -DLORA_RADIO1_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO1_SYNC_WORD=0x2B

; Radio 2 settings:
; defaulted to Meshcore settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
    -DLORA_RADIO2_FREQUENCY=910.525f
    -DLORA_RADIO2_BANDWIDTH=62.5f
    -DLORA_RADIO2_SPREAD_FACTOR=7
    -DLORA_RADIO2_CODING_RATE=5
    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO2_SYNC_WORD=0x12

; defaulted to Meshtastic long/fast settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO1_FREQUENCY=906.875f
;    -DLORA_RADIO1_BANDWIDTH=250.0f
;    -DLORA_RADIO1_SPREAD_FACTOR=11
;    -DLORA_RADIO1_CODING_RATE=5
;    -DLORA_RADIO1_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO1_SYNC_WORD=0x2B

; defaulted to Meshcore settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
;    -DLORA_RADIO2_FREQUENCY=910.525f
;    -DLORA_RADIO2_BANDWIDTH=62.5f
;    -DLORA_RADIO2_SPREAD_FACTOR=7
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x12

; defaulted rnode settings
;    -DLORA_RADIO2_FREQUENCY=914.875f
;    -DLORA_RADIO2_BANDWIDTH=125.0f
;    -DLORA_RADIO2_SPREAD_FACTOR=8
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
;    -DLORA_RADIO2_SYNC_WORD=0x42

; Global LoRa settings (applied to all radios):
;    -DLORA_PREAMBLE_LEN=8
;    -DLORA_CRC=1
;    -DLORA_TCXO_VOLTAGE=1.8f
;    -DLORA_MAX_PACKET=256

; MeshCore channel selection. Default is the MeshCore public channel
; (hash 0x11). Override the key and display name to bridge a private/custom
; channel instead. KEY_HEX must be exactly 32 lowercase hex chars; the
; on-air channel-hash byte is derived from SHA-256(key)[0] at boot so you
; never have to compute it by hand.
;    '-DBRIDGE_MC_KEY_HEX="8b3387e9c5cdea6ac9e5edbaa115cd72"'
;    '-DBRIDGE_MC_CHANNEL_NAME="public"'

; Per-portnum bridging toggles for Meshtastic source. Both default ON; set
; to 0 to keep the corresponding traffic local to the MT mesh.
;    -DBRIDGE_MT_POSITION=1
;    -DBRIDGE_MT_TELEMETRY=1

; Meshtastic channel selection. Default is the LongFast public channel.
; Override to bridge a private/custom MT channel. PSK is the base64 string
; the Meshtastic app shows for the channel; blank == LongFast. It must
; decode to 1 byte (short key), 16 bytes (AES-128) or 32 bytes (AES-256).
; The on-air channel-hash byte is derived automatically at boot.
;    '-DBRIDGE_MT_CHANNEL_NAME="LongFast"'
;    '-DBRIDGE_MT_PSK_B64="AQ=="'

; RNS-source fragmentation. Max fragments per frame (default 8). As of v8.2 the
; old per-fragment delay knobs (BRIDGE_RNS_FRAG_DELAY_MT/MC_MS) are GONE —
; fragments are paced by the per-radio airtime throttle below, not inline delays.
;    -DBRIDGE_RNS_MAX_FRAGS=8

; v8.3 — in-protocol Reticulum repeat. When both radios run RNS, an inbound RNS
; frame is re-transmitted byte-for-byte on the other radio (transparent repeater)
; instead of only tunnelling to MT/MC. 1 = on (default), 0 = pre-v8.3 tunnel-only.
;    -DBRIDGE_RNS_INPROTO_REPEAT=1

; v8.3 — LoRaWAN (sync 0x34) keyless capture/relay/mesh. Reads only the cleartext
; PHY header (no keys, no FRMPayload decrypt, no inject into LoRaWAN). Select
; "LoRaWAN" as a radio's protocol in the captive portal (sync auto-set to 0x34).
;    -DBRIDGE_LW_CAPTURE=1          ; log evt=RX proto=LW header metadata
;    -DBRIDGE_LW_SUMMARY_TO_MESH=1  ; also emit a one-line metadata summary to MT/MC
;    -DBRIDGE_LW_RELAY=1            ; transparent raw repeat to other 0x34 radios

; ===========================================================================
; v8.2 RX-priority routing + identity-preservation tunables
; ---------------------------------------------------------------------------
; All optional; the values shown are the compiled-in defaults. Uncomment to
; override. (See V8.2-SPEC.md §13 for the serial-log schema these affect.)
;
; -- Content-hash loop/dup guard (DedupCache, replaces the old text marker) --
;    -DBRIDGE_DEDUP_TTL_MS=60000        ; window a seen (body+srcId) hash blocks dups
;    -DBRIDGE_DEDUP_TABLE_SIZE=512      ; recent-hash table entries (~12 B each)
;
; -- Per-destination outbound queue (RouteQueue, PSRAM-backed) --------------
;    -DBRIDGE_ROUTE_QUEUE_DEPTH=64      ; packets buffered per destination radio
;    -DBRIDGE_ROUTE_MAX_AGE_MS=30000    ; drop a queued/latched packet older than this
;
; -- TX scheduler: CAD (listen-before-talk) + CSMA backoff + safety timeout --
;    -DBRIDGE_CAD_BACKOFF_MIN_MS=20     ; random CSMA backoff floor after a busy CAD
;    -DBRIDGE_CAD_BACKOFF_MAX_MS=120    ; random CSMA backoff ceiling
;    -DBRIDGE_TX_INFLIGHT_TIMEOUT_MS=10000 ; force-recover a non-blocking TX that never reports done
;
; -- Full-mesh airtime throttle (duty-cycle cap on the bridge's own TX) ------
;    -DBRIDGE_TX_DUTY_PERCENT=50        ; max self-TX duty %; 0 = no duty cap (min-gap only)
;    -DBRIDGE_TX_MIN_GAP_MS=0           ; absolute floor on the post-TX off-air gap
;
; -- Source-identity preservation (V8.2-SPEC §5) ----------------------------
;    -DBRIDGE_IDENTITY_PRESERVE=1       ; 0 = clean-body / bridge-identity (redesign default)
;    -DBRIDGE_TAG_ORIGIN_PROTO=1        ; 1 = "Alice@MT:" / "Alice @MC"; 0 = bare native-looking names
;    -DBRIDGE_MC_NONAME_VIRTUAL=0       ; MC body with no "name: " prefix: 0 = bridge id, 1 = per-channel virtual node
;    -DBRIDGE_MC_NAME_MAX=32            ; longest MeshCore sender name parsed from a body prefix
;    -DBRIDGE_VIRT_NODES_MAX=32         ; virtual-node LRU size (NodeInfo rate-limiting)
;    -DBRIDGE_VIRT_NODEINFO_PERIOD_MS=900000 ; re-advertise a virtual node's NodeInfo no more often than this

; Cross-protocol bridge identity (Meshtastic side).
; The numeric ID and string form MUST encode the same value:
;   "!b16b00b5" <-> 0xB16B00B5u
; String macros are single-quoted so values with spaces (e.g. "LoRa Bridge")
; survive shell tokenization unchanged.
    -DBRIDGE_MT_NODE_ID=0xB16B00B5u
    '-DBRIDGE_MT_NODE_ID_STR="!b16b00b5"' #32-bit hex with "!" prefix, as used in Meshtastic UI
    '-DBRIDGE_MT_LONG_NAME="B16B00B5 LoRa Bridge"' #long name for Meshtastic UI, max 23 chars
    '-DBRIDGE_MT_SHORT_NAME="BR"' #short name for Meshtastic UI, max 8 chars

; Upload & monitor
monitor_speed = 115200
upload_speed  = 921600

; ===========================================================================
; RADIO-2 EDGE-MODULE REVISION VARIANT
; ---------------------------------------------------------------------------
; The Seeed "Wio-SX1262 for XIAO" edge module (Radio 2) changed its pinout
; between silkscreen revisions. The default env above (xiao_esp32s3) targets
; the V1.0 module. If YOUR Radio-2 module silkscreen reads "V1.1" (NSS on
; D3/GPIO4 instead of D4/GPIO5), build THIS env instead:
;     pio run -e xiao_esp32s3_v1_1 -t upload --upload-port COMx
; It inherits everything from the base env and only flips the Radio-2 pin map
; via -DWIO_SX1262_REV=11. See README "Wiring" for how to read the silkscreen.
; (Do NOT use `extends` here — reference the base build_flags once via ${...}
; and let the trailing -D win, per the bench-env warning below.)
; ---------------------------------------------------------------------------
[env:xiao_esp32s3_v1_1]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DWIO_SX1262_REV=11

; ===========================================================================
; v8.3 BENCH HELPER ENVS — pre-fill the captive portal with LoRaWAN on Radio 1.
; ---------------------------------------------------------------------------
; An erased/unconfigured board ALWAYS opens the captive portal (it will not
; bridge until you Save once); build flags only PRE-FILL that form. These envs
; make the portal come up pre-set to LoRaWAN, so you just click Save:
;     pio run -e bench_lw_dutA -t erase  --upload-port COM13
;     pio run -e bench_lw_dutA -t upload --upload-port COM13
;     pio device monitor --port COM13     ; portal opens pre-set to LoRaWAN
;     # join the AP, browse 192.168.4.1, click Save -> reboots into sync 0x34
; Not for release (shipping firmware = env:xiao_esp32s3). IMPORTANT: do NOT add
; `extends` here — combining `extends` with ${env:xiao_esp32s3.build_flags}
; duplicates the base flags and reorders -U/-D so the macros end up UNDEFINED
; (radios silently fall back to Meshtastic). Reference the base flags ONCE via
; ${...} and let the trailing -D overrides win (last definition wins).
; ---------------------------------------------------------------------------

; DUT-A (Pass B): R1 = LoRaWAN 904.6 / BW125 / SF7, R2 = MeshCore (default).
[env:bench_lw_dutA]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DLORA_RADIO1_SYNC_WORD=0x34
    -DLORA_RADIO1_FREQUENCY=904.6f
    -DLORA_RADIO1_BANDWIDTH=125.0f
    -DLORA_RADIO1_SPREAD_FACTOR=7

; DUT-B (Pass C secondary): R1 = LoRaWAN 903.9 / BW125 / SF7, R2 = MeshCore.
[env:bench_lw_dutB]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DLORA_RADIO1_SYNC_WORD=0x34
    -DLORA_RADIO1_FREQUENCY=903.9f
    -DLORA_RADIO1_BANDWIDTH=125.0f
    -DLORA_RADIO1_SPREAD_FACTOR=7

; --- ABP P1: LoRaWAN ABP encoder bench --------------------------------------
; R1 = Meshtastic (default LongFast), R2 = LoRaWAN ABP-encode 903.9 / BW125 / SF7.
; A Meshtastic text routed to R2 is transcoded into a LoRaWAN ABP uplink and
; re-emitted on 903.9 (delivery model B1) — provision a matching ABP device in
; ChirpStack (DevAddr 01000001 + the keys below, MAC 1.0.x, ADR off, Class A) to
; see the decoded uplink. Boot self-test runs the RFC4493/keystream/frame KATs.
; THROWAWAY KEYS — bench only, never a real fleet.
; DevAddr 0x01000001 = NwkID 0 (top 7 bits), matching ChirpStack's default private
; NetID 0x000000 — a DevAddr whose NwkID is outside the LNS's NetID is silently
; dropped (this is why the old 0x26011B22 / NwkID 19 was a bad default). REGION=US
; so the bench runs the documented US915 channel plan (the dwell gate stays inert
; at SF7; see bench_lw_enc_dwell for the dwell test).
[env:bench_lw_enc]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DBRIDGE_REGION=1
    -DLORA_RADIO2_SYNC_WORD=0x34
    -DLORA_RADIO2_FREQUENCY=903.9f
    -DLORA_RADIO2_BANDWIDTH=125.0f
    -DLORA_RADIO2_SPREAD_FACTOR=7
    -DBRIDGE_LW_ENCODE=1
    -DBRIDGE_LW_ENC_SELFTEST=1
    -DBRIDGE_LW_ENC_DEVADDR=0x01000001u
    -DBRIDGE_LW_ENC_FPORT=13
    '-DBRIDGE_LW_ENC_NWKSKEY="2B7E151628AED2A6ABF7158809CF4F3C"'
    '-DBRIDGE_LW_ENC_APPSKEY="D41420B7F5A3C96E1D8204F7B3A65C90"'

; --- v8.4 P4 dwell test: US915 + high SF (SF12) so a routed ABP uplink's ToA
; (~1.5 s) exceeds the FCC 400 ms dwell cap and the TX scheduler drops it
; (evt=DROP drop=dwell). Identical to bench_lw_enc otherwise. ----------------
[env:bench_lw_enc_dwell]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DBRIDGE_REGION=1
    -DLORA_RADIO2_SYNC_WORD=0x34
    -DLORA_RADIO2_FREQUENCY=903.9f
    -DLORA_RADIO2_BANDWIDTH=125.0f
    -DLORA_RADIO2_SPREAD_FACTOR=12
    -DBRIDGE_LW_ENCODE=1
    -DBRIDGE_LW_ENC_SELFTEST=1
    -DBRIDGE_LW_ENC_DEVADDR=0x01000001u
    -DBRIDGE_LW_ENC_FPORT=13
    '-DBRIDGE_LW_ENC_NWKSKEY="2B7E151628AED2A6ABF7158809CF4F3C"'
    '-DBRIDGE_LW_ENC_APPSKEY="D41420B7F5A3C96E1D8204F7B3A65C90"'

; --- v8.4 "synthetic LNS" sniffer: keyless LoRaWAN capture on the DUT's uplink
; channel. RXes the ABP uplink the DUT emits and prints the cleartext header
; (evt=RX proto=LW devaddr/fcnt/fport) + the full PHYPayload hex (evt=LWRAW raw=…)
; so most encoder tests (emission, DevAddr/FPort, FCnt monotonicity, dwell/overflow
; silence) need NO ChirpStack. Feed evt=LWRAW raw=… + the keys to tools/lw-verify.py
; to validate MIC + decrypt FRMPayload off-box. RELAY/SUMMARY off = pure sniffer.
; Set its capture radio (R2) to the SAME freq/BW/SF the DUT emits on (903.9/BW125/SF7).
[env:bench_lw_sniffer]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DLORA_RADIO2_SYNC_WORD=0x34
    -DLORA_RADIO2_FREQUENCY=903.9f
    -DLORA_RADIO2_BANDWIDTH=125.0f
    -DLORA_RADIO2_SPREAD_FACTOR=7
    -DBRIDGE_LW_CAPTURE=1
    -DBRIDGE_LW_CAPTURE_HEX=1
    -DBRIDGE_LW_SUMMARY_TO_MESH=0
    -DBRIDGE_LW_RELAY=0

; --- v8.4 ABP release-candidate: portal-configured ABP encoder (P2) ---------
; Like the stock vanilla build but with the keyed ABP encoder compiled in. NO
; BRIDGE_BENCH_AUTOSAVE (so it boots into the captive portal) and NO build-flag
; keys (so the portal "LoRaWAN ABP devices" section + NVS own the credentials).
; In the portal: set a radio to LoRaWAN, add an ABP device, Save & reboot, bench.
[env:xiao_esp32s3_lwabp]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_LW_ENCODE=1
    -DBRIDGE_LW_ENC_SELFTEST=1

