; PlatformIO project configuration
; XIAO ESP32S3 Dual SX1262 Crossover Bridge

[env:xiao_esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

; RadioLib — SX1262 support
lib_deps =
    jgromes/RadioLib @ ^6.6.0

; Enable verbose ESP-IDF logging over USB-CDC serial
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

; Per-radio LoRa RF settings — configure each radio independently
; Call setRadioId(1) or setRadioId(2) before begin() to use these macros
; Or override per-radio settings in code with setLoraConfig()

; Radio 1 settings:
    -DLORA_RADIO1_FREQUENCY=913.0f       (MHz)
;    -DLORA_RADIO1_BANDWIDTH=125.0f       (kHz)
;    -DLORA_RADIO1_SPREAD_FACTOR=9        (5-12)
;    -DLORA_RADIO1_CODING_RATE=7         (5-8)
;    -DLORA_RADIO1_TX_POWER=20           (dBm, -9 to +22)
;    -DLORA_RADIO1_SYNC_WORD=0x12        (0x00-0xFF)

; Radio 2 settings:
    -DLORA_RADIO2_FREQUENCY=915.0f       (MHz)
;    -DLORA_RADIO2_BANDWIDTH=125.0f       (kHz)
;    -DLORA_RADIO2_SPREAD_FACTOR=9        (5-12)
;    -DLORA_RADIO2_CODING_RATE=7         (5-8)
;    -DLORA_RADIO2_TX_POWER=20           (dBm, -9 to +22)
;    -DLORA_RADIO2_SYNC_WORD=0x12        (0x00-0xFF)

; Global LoRa settings (applied to all radios):
;    -DLORA_PREAMBLE_LEN=8
;    -DLORA_CRC=1
;    -DLORA_TCXO_VOLTAGE=1.8f
;    -DLORA_MAX_PACKET=256

; Upload & monitor
monitor_speed = 115200
upload_speed  = 921600
