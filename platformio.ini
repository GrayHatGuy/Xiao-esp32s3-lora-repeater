; PlatformIO project configuration
; XIAO ESP32S3 Dual SX1262 Crossover Bridge

[env:xiao_esp32s3]
; Pinned: the bridge is verified against Espressif32 6.13.0 (arduino-esp32
; 2.0.17). Leaving this unpinned lets a fresh checkout pull a newer core
; whose GPIO/SPI behaviour differs — keep it pinned for reproducible builds.
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino

; RadioLib — SX1262 support. Pinned 7.7.0 for v8.2: this is the version the
; RX-priority TX/CAD path (scanChannel/startTransmit/finishTransmit) was
; developed and bench-validated against on the SX1262.
lib_deps =
    jgromes/RadioLib @ 7.7.0

; Enable verbose ESP-IDF logging over USB-CDC serial
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRADIOLIB_DEBUG_BASIC=1

; v8.4: the keyed LoRaWAN ABP uplink encoder now ships in the STANDARD build — V1.0
; here AND V1.1 (which inherits ${env:xiao_esp32s3.build_flags}). It is DORMANT until
; you set a radio to LoRaWAN and add an ABP device in the captive portal, so a stock
; MT/MC bridge is behaviourally unchanged (boot just adds a [LoRaWANConfig]/[lw-enc]
; line; +~12 KB flash). Self-test stays off here (the lwabp env keeps it on).
    -DBRIDGE_LW_ENCODE=1

; Per-radio LoRa RF settings — configure each radio independently
; Call setRadioId(1) or setRadioId(2) before begin() to use these macros
; Or override per-radio settings in code with setLoraConfig()

; Radio 1 settings:
; defaulted to Meshtastic long/fast settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
    -DLORA_RADIO1_FREQUENCY=906.875f
    -DLORA_RADIO1_BANDWIDTH=250.0f
    -DLORA_RADIO1_SPREAD_FACTOR=11
    -DLORA_RADIO1_CODING_RATE=5
    -DLORA_RADIO1_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO1_SYNC_WORD=0x2B

; Radio 2 settings:
; defaulted to Meshcore settings
; Frequency (MHz), Bandwidth (kHz), SF (5-12), CR (5-8), TX power (dBm -9 to +22), sync word (0x00-0xFF)
    -DLORA_RADIO2_FREQUENCY=910.525f
    -DLORA_RADIO2_BANDWIDTH=62.5f
    -DLORA_RADIO2_SPREAD_FACTOR=7
    -DLORA_RADIO2_CODING_RATE=5
    -DLORA_RADIO2_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO2_SYNC_WORD=0x12

; ===========================================================================
; v8.5 — RADIO 3 / RADIO 4 (second XIAO's SX1262, remote over the UART crossover)
; ---------------------------------------------------------------------------
; This bridge can drive FOUR SX1262 radios by pairing two XIAO boards over a
; UART crossover: R1/R2 are THIS XIAO's local radios; R3/R4 are the SECOND
; XIAO's two SX1262, reached over the link below. The second XIAO runs the
; lightweight radio co-processor firmware (env:xiao_coproc_sx1262); this host
; owns the config + captive portal for all four radios and pushes R3/R4's RF to
; the co-processor over the link.
;
; These flags SEED R3/R4's first-boot RF (cloned from the R1/R2 pattern above);
; R3/R4 still default to DISABLED (PROTO_NONE), so a single-board build behaves
; exactly like the 2-radio bridge. ENABLE them (pick a protocol) and set the
; routing matrix in the captive portal, which then pre-fills these RF values.
;
; Radio 3 settings (defaults: Meshtastic long/fast, like Radio 1):
    -DLORA_RADIO3_FREQUENCY=906.875f
    -DLORA_RADIO3_BANDWIDTH=250.0f
    -DLORA_RADIO3_SPREAD_FACTOR=11
    -DLORA_RADIO3_CODING_RATE=5
    -DLORA_RADIO3_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO3_SYNC_WORD=0x2B

; Radio 4 settings (defaults: MeshCore, like Radio 2):
    -DLORA_RADIO4_FREQUENCY=910.525f
    -DLORA_RADIO4_BANDWIDTH=62.5f
    -DLORA_RADIO4_SPREAD_FACTOR=7
    -DLORA_RADIO4_CODING_RATE=5
    -DLORA_RADIO4_TX_POWER=20
; Sync word: 0x12 for meshcore, 0x42 for reticulum, 0x2B for meshtastic, 0x34 for lorawan
    -DLORA_RADIO4_SYNC_WORD=0x12

; Optional per-radio channel overrides for R3/R4 (same idea as R1/R2 below):
;    '-DLORA_RADIO3_CHANNEL_NAME="LongFast"'   ; MT: display name | MC: display name
;    '-DLORA_RADIO3_CHANNEL_KEY="AQ=="'        ; MT: base64 PSK   | MC: 32 hex key
;    '-DLORA_RADIO4_CHANNEL_NAME="public"'
;    '-DLORA_RADIO4_CHANNEL_KEY="..."'

; Inter-XIAO UART crossover link. Defaults (main.cpp): this XIAO's UART1
; TX=GPIO43 (D6) / RX=GPIO44 (D7) @ 460800 baud. Wire it CROSSED to the second
; XIAO: A.D6->B.D7, A.D7->B.D6, GND<->GND. Both boards use the same pin defaults;
; the cable does the crossover. Override here only if you wire a different UART.
;    -DBRIDGE_LINK_TX_PIN=43
;    -DBRIDGE_LINK_RX_PIN=44
;    -DBRIDGE_LINK_BAUD=460800
; ===========================================================================

; ===========================================================================
; v9.0 — READY-MADE 4-RADIO (DUAL-XIAO) SCENARIO   [host + co-processor]
; ---------------------------------------------------------------------------
; A 4-radio bridge is TWO Xiao boards: THIS one (the HOST, R1/R2 local) plus a
; SECOND Xiao (the CO-PROC, R3/R4) over the UART crossover wired above. By
; default R3/R4 are DISABLED (PROTO_NONE), so a SINGLE board still runs exactly
; like the original 2-radio MT<->MC bridge -- do nothing here for that (this is
; the backwards-compatible default).
;
; To go 4-radio: (1) UNCOMMENT the block below to enable + route R3/R4, then
; (2) flash the SECOND board with the co-processor firmware (-d points at it):
;       pio run -d coproc-xiao-sx1262 -e xiao_coproc_sx1262      -t upload --upload-port COM_B
;       pio run -d coproc-xiao-sx1262 -e xiao_coproc_sx1262_v1_1 -t upload --upload-port COM_B   ; V1.1 edge module
;
; --- Scenario D: 4-radio HOST -- R1 MT, R2 MC, R3 MT(2nd chan), R4 Reticulum --
; routeMask bits: bit0=R1(0x01) bit1=R2(0x02) bit2=R3(0x04) bit3=R4(0x08).
; LORA_RADIOn_ROUTE_MASK = which radios a packet RX'd on radio n is bridged to
; (0x0F = all four; a radio is never bridged back to itself).
;    -DLORA_RADIO3_ENABLE                      ; turn R3 on (else it stays PROTO_NONE)
;    -DLORA_RADIO3_SYNC_WORD=0x2B              ; 0x2B MT / 0x12 MC / 0x42 RNS / 0x34 LoRaWAN
;    -DLORA_RADIO3_FREQUENCY=914.875f          ; MUST differ from R1 (same chan+freq is rejected)
;    -DLORA_RADIO3_BANDWIDTH=250.0f
;    -DLORA_RADIO3_SPREAD_FACTOR=11
;    '-DLORA_RADIO3_CHANNEL_NAME="MyPrivate"'  ; R3 = your 2nd Meshtastic channel
;    '-DLORA_RADIO3_CHANNEL_KEY="<base64 PSK>"'
;    -DLORA_RADIO4_ENABLE                      ; turn R4 on (else it stays PROTO_NONE)
;    -DLORA_RADIO4_SYNC_WORD=0x42              ; Reticulum
;    -DLORA_RADIO4_FREQUENCY=906.875f
;    -DLORA_RADIO4_BANDWIDTH=250.0f
;    -DLORA_RADIO4_SPREAD_FACTOR=11
;    '-DLORA_RADIO4_CHANNEL_NAME="reticulum"'
;    ; -- per-source routing matrix (omit a mask = that radio bridges nowhere) --
;    -DLORA_RADIO1_ROUTE_MASK=0x0E             ; R1 -> R2,R3,R4
;    -DLORA_RADIO2_ROUTE_MASK=0x0D             ; R2 -> R1,R3,R4
;    -DLORA_RADIO3_ROUTE_MASK=0x0B             ; R3 -> R1,R2,R4
;    -DLORA_RADIO4_ROUTE_MASK=0x07             ; R4 -> R1,R2,R3
; You can still change all of this (incl. the routing) live in the captive
; portal; these flags only PRE-FILL a fresh/erased board's first boot.
; ===========================================================================

; ===========================================================================
; v8.4.1 — PER-RADIO CHANNEL OVERRIDES + READY-MADE SCENARIO SETUPS
; ---------------------------------------------------------------------------
; Optional first-boot overrides so EACH radio can preload a DISTINCT channel
; name/key. The BRIDGE_MT_*/BRIDGE_MC_* defaults above are shared by protocol,
; so two same-protocol radios (e.g. MT public -> MT private) would otherwise
; collide on one channel. Applied only when defined.
;    '-DLORA_RADIO1_CHANNEL_NAME="LongFast"'   ; MT: display name | MC: display name
;    '-DLORA_RADIO1_CHANNEL_KEY="AQ=="'        ; MT: base64 PSK   | MC: 32 hex key
;    '-DLORA_RADIO2_CHANNEL_NAME="MyPrivate"'
;    '-DLORA_RADIO2_CHANNEL_KEY="..."'
;
; The three scenarios below match the user manual (CONFIG-USER-MANUAL.md).
; To use B or C: COMMENT OUT the active "Radio 1/2 settings" block near the top
; of build_flags, then UNCOMMENT exactly one scenario block. A fresh/erased
; board boots preloaded (you can still tweak it in the captive portal).
;
; --- Scenario A: R1 Meshtastic -> R2 MeshCore ---
;   THIS IS THE ACTIVE DEFAULT above (R1 LongFast 906.875 / R2 MeshCore public
;   910.525) — nothing to uncomment.
;
; --- Scenario B: R1 Meshtastic -> R2 LoRaWAN (ABP uplink to ChirpStack) ---
;    -DLORA_RADIO1_FREQUENCY=906.875f
;    -DLORA_RADIO1_BANDWIDTH=250.0f
;    -DLORA_RADIO1_SPREAD_FACTOR=11
;    -DLORA_RADIO1_CODING_RATE=5
;    -DLORA_RADIO1_TX_POWER=20
;    -DLORA_RADIO1_SYNC_WORD=0x2B
;    -DLORA_RADIO2_FREQUENCY=903.9f           ; US915 FSB2 ch8 = DR3 (SF7/125)
;    -DLORA_RADIO2_BANDWIDTH=125.0f
;    -DLORA_RADIO2_SPREAD_FACTOR=7
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
;    -DLORA_RADIO2_SYNC_WORD=0x34             ; LoRaWAN
;    ; provision the SAME DevAddr + keys in ChirpStack (MAC 1.0.x / ABP / Class A / ADR off):
;    -DBRIDGE_LW_ENC_DEVADDR=0x01000001u      ; NwkID 0 -> matches ChirpStack default NetID
;    '-DBRIDGE_LW_ENC_NWKSKEY="00112233445566778899aabbccddeeff"'  ; <- your 32-hex key
;    '-DBRIDGE_LW_ENC_APPSKEY="ffeeddccbbaa99887766554433221100"'  ; <- your 32-hex key
;    -DBRIDGE_LW_ENC_FPORT=13
;    ; (BRIDGE_LW_ENCODE=1 is already on in the standard build.)
;
; --- Scenario C: R1 Meshtastic public -> R2 Meshtastic private channel ---
;    -DLORA_RADIO1_FREQUENCY=906.875f
;    -DLORA_RADIO1_BANDWIDTH=250.0f
;    -DLORA_RADIO1_SPREAD_FACTOR=11
;    -DLORA_RADIO1_CODING_RATE=5
;    -DLORA_RADIO1_TX_POWER=20
;    -DLORA_RADIO1_SYNC_WORD=0x2B
;    '-DLORA_RADIO1_CHANNEL_NAME="LongFast"'  ; R1 = public LongFast
;    '-DLORA_RADIO1_CHANNEL_KEY="AQ=="'
;    -DLORA_RADIO2_FREQUENCY=914.875f         ; MUST differ from R1 (same chan+freq is rejected)
;    -DLORA_RADIO2_BANDWIDTH=250.0f
;    -DLORA_RADIO2_SPREAD_FACTOR=11
;    -DLORA_RADIO2_CODING_RATE=5
;    -DLORA_RADIO2_TX_POWER=20
;    -DLORA_RADIO2_SYNC_WORD=0x2B             ; R2 = Meshtastic too
;    '-DLORA_RADIO2_CHANNEL_NAME="MyPrivate"' ; R2 = your private channel name
;    '-DLORA_RADIO2_CHANNEL_KEY="AbCdEf0123456789AbCdEf0123456789AbCdEf0123456789AbCd"'  ; <- base64 PSK from the Meshtastic app
; ===========================================================================

; RNS-source fragmentation. Max fragments per frame (default 8). As of v8.2 the
; old per-fragment delay knobs (BRIDGE_RNS_FRAG_DELAY_MT/MC_MS) are GONE —
; fragments are paced by the per-radio airtime throttle below, not inline delays.
;    -DBRIDGE_RNS_MAX_FRAGS=8

; v8.3 — in-protocol Reticulum repeat. When both radios run RNS, an inbound RNS
; frame is re-transmitted byte-for-byte on the other radio (transparent repeater)
; instead of only tunnelling to MT/MC. 1 = on (default), 0 = pre-v8.3 tunnel-only.
;    -DBRIDGE_RNS_INPROTO_REPEAT=1

; v8.3 — LoRaWAN (sync 0x34) keyless capture/relay/mesh. Reads only the cleartext
; PHY header (no keys, no FRMPayload decrypt, no inject into LoRaWAN). Select
; "LoRaWAN" as a radio's protocol in the captive portal (sync auto-set to 0x34).
;    -DBRIDGE_LW_CAPTURE=1          ; log evt=RX proto=LW header metadata
;    -DBRIDGE_LW_SUMMARY_TO_MESH=1  ; also emit a one-line metadata summary to MT/MC
;    -DBRIDGE_LW_RELAY=1            ; transparent raw repeat to other 0x34 radios

; ===========================================================================
; v8.2 RX-priority routing + identity-preservation tunables
; ---------------------------------------------------------------------------
; All optional; the values shown are the compiled-in defaults. Uncomment to
; override. (See V8.2-SPEC.md §13 for the serial-log schema these affect.)
;
; -- Content-hash loop/dup guard (DedupCache, replaces the old text marker) --
;    -DBRIDGE_DEDUP_TTL_MS=60000        ; window a seen (body+srcId) hash blocks dups
;    -DBRIDGE_DEDUP_TABLE_SIZE=512      ; recent-hash table entries (~12 B each)
;
; -- Per-destination outbound queue (RouteQueue, PSRAM-backed) --------------
;    -DBRIDGE_ROUTE_QUEUE_DEPTH=64      ; packets buffered per destination radio
;    -DBRIDGE_ROUTE_MAX_AGE_MS=30000    ; drop a queued/latched packet older than this
;
; -- TX scheduler: CAD (listen-before-talk) + CSMA backoff + safety timeout --
;    -DBRIDGE_CAD_BACKOFF_MIN_MS=20     ; random CSMA backoff floor after a busy CAD
;    -DBRIDGE_CAD_BACKOFF_MAX_MS=120    ; random CSMA backoff ceiling
;    -DBRIDGE_TX_INFLIGHT_TIMEOUT_MS=10000 ; force-recover a non-blocking TX that never reports done
;
; -- Full-mesh airtime throttle (duty-cycle cap on the bridge's own TX) ------
;    -DBRIDGE_TX_DUTY_PERCENT=50        ; max self-TX duty %; 0 = no duty cap (min-gap only)
;    -DBRIDGE_TX_MIN_GAP_MS=0           ; absolute floor on the post-TX off-air gap
;
; -- Source-identity preservation (V8.2-SPEC §5) ----------------------------
;    -DBRIDGE_IDENTITY_PRESERVE=1       ; 0 = clean-body / bridge-identity (redesign default)
;    -DBRIDGE_TAG_ORIGIN_PROTO=1        ; 1 = "Alice@MT:" / "Alice @MC"; 0 = bare native-looking names
;    -DBRIDGE_MC_NONAME_VIRTUAL=0       ; MC body with no "name: " prefix: 0 = bridge id, 1 = per-channel virtual node
;    -DBRIDGE_MC_NAME_MAX=32            ; longest MeshCore sender name parsed from a body prefix
;    -DBRIDGE_VIRT_NODES_MAX=32         ; virtual-node LRU size (NodeInfo rate-limiting)
;    -DBRIDGE_VIRT_NODEINFO_PERIOD_MS=900000 ; re-advertise a virtual node's NodeInfo no more often than this

; Cross-protocol bridge identity (Meshtastic side) is DERIVED FROM THE DEVICE MAC on
; first boot (deriveMacIdentity() in src/main.cpp): node id + "!hex" string, long name
; "<ID-hex> LoRa Bridge", short name "BR<low-byte>" — unique per board, and editable in
; the captive portal. So there are no BRIDGE_MT_NODE_ID / _STR / _LONG_NAME / _SHORT_NAME
; flags here: any value set would just be overwritten by the MAC derivation. (The
; src/BridgeConfig.cpp #ifndef fallbacks remain as the pre-derivation safety default.)

; Upload & monitor
monitor_speed = 115200
upload_speed  = 921600

; ===========================================================================
; RADIO-2 EDGE-MODULE REVISION VARIANT
; ---------------------------------------------------------------------------
; The Seeed "Wio-SX1262 for XIAO" edge module (Radio 2) changed its pinout
; between silkscreen revisions. The default env above (xiao_esp32s3) targets
; the V1.0 module. If YOUR Radio-2 module silkscreen reads "V1.1" (NSS on
; D3/GPIO4 instead of D4/GPIO5), build THIS env instead:
;     pio run -e xiao_esp32s3_v1_1 -t upload --upload-port COMx
; It inherits everything from the base env and only flips the Radio-2 pin map
; via -DWIO_SX1262_REV=11. See README "Wiring" for how to read the silkscreen.
; (Do NOT use `extends` here — reference the base build_flags once via ${...}
; and let the trailing -D win, per the bench-env warning below.)
; ---------------------------------------------------------------------------
[env:xiao_esp32s3_v1_1]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DWIO_SX1262_REV=11

; ===========================================================================
; v8.3 BENCH HELPER ENVS — pre-fill the captive portal with LoRaWAN on Radio 1.
; ---------------------------------------------------------------------------
; An erased/unconfigured board ALWAYS opens the captive portal (it will not
; bridge until you Save once); build flags only PRE-FILL that form. These envs
; make the portal come up pre-set to LoRaWAN, so you just click Save:
;     pio run -e bench_lw_dutA -t erase  --upload-port COM13
;     pio run -e bench_lw_dutA -t upload --upload-port COM13
;     pio device monitor --port COM13     ; portal opens pre-set to LoRaWAN
;     # join the AP, browse 192.168.4.1, click Save -> reboots into sync 0x34
; Not for release (shipping firmware = env:xiao_esp32s3). IMPORTANT: do NOT add
; `extends` here — combining `extends` with ${env:xiao_esp32s3.build_flags}
; duplicates the base flags and reorders -U/-D so the macros end up UNDEFINED
; (radios silently fall back to Meshtastic). Reference the base flags ONCE via
; ${...} and let the trailing -D overrides win (last definition wins).
; ---------------------------------------------------------------------------

; DUT-A (Pass B): R1 = LoRaWAN 904.6 / BW125 / SF7, R2 = MeshCore (default).
[env:bench_lw_dutA]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DLORA_RADIO1_SYNC_WORD=0x34
    -DLORA_RADIO1_FREQUENCY=904.6f
    -DLORA_RADIO1_BANDWIDTH=125.0f
    -DLORA_RADIO1_SPREAD_FACTOR=7

; DUT-B (Pass C secondary): R1 = LoRaWAN 903.9 / BW125 / SF7, R2 = MeshCore.
[env:bench_lw_dutB]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DLORA_RADIO1_SYNC_WORD=0x34
    -DLORA_RADIO1_FREQUENCY=903.9f
    -DLORA_RADIO1_BANDWIDTH=125.0f
    -DLORA_RADIO1_SPREAD_FACTOR=7

; --- ABP P1: LoRaWAN ABP encoder bench --------------------------------------
; R1 = Meshtastic (default LongFast), R2 = LoRaWAN ABP-encode 903.9 / BW125 / SF7.
; A Meshtastic text routed to R2 is transcoded into a LoRaWAN ABP uplink and
; re-emitted on 903.9 (delivery model B1) — provision a matching ABP device in
; ChirpStack (DevAddr 01000001 + the keys below, MAC 1.0.x, ADR off, Class A) to
; see the decoded uplink. Boot self-test runs the RFC4493/keystream/frame KATs.
; THROWAWAY KEYS — bench only, never a real fleet.
; DevAddr 0x01000001 = NwkID 0 (top 7 bits), matching ChirpStack's default private
; NetID 0x000000 — a DevAddr whose NwkID is outside the LNS's NetID is silently
; dropped (this is why the old 0x26011B22 / NwkID 19 was a bad default). REGION=US
; so the bench runs the documented US915 channel plan (the dwell gate stays inert
; at SF7; see bench_lw_enc_dwell for the dwell test).
[env:bench_lw_enc]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DBRIDGE_REGION=1
    -DLORA_RADIO2_SYNC_WORD=0x34
    -DLORA_RADIO2_FREQUENCY=903.9f
    -DLORA_RADIO2_BANDWIDTH=125.0f
    -DLORA_RADIO2_SPREAD_FACTOR=7
    -DBRIDGE_LW_ENCODE=1
    -DBRIDGE_LW_ENC_SELFTEST=1
    -DBRIDGE_LW_ENC_DEVADDR=0x01000001u
    -DBRIDGE_LW_ENC_FPORT=13
    '-DBRIDGE_LW_ENC_NWKSKEY="2B7E151628AED2A6ABF7158809CF4F3C"'
    '-DBRIDGE_LW_ENC_APPSKEY="D41420B7F5A3C96E1D8204F7B3A65C90"'

; --- v8.5 B1 (GATING): ABP uplink encoded by the host and TRANSMITTED ON THE
; REMOTE radio R3 (the co-processor's SX1262) over the UART link — the new v8.5
; path (v8.4 already proved the encoder on a LOCAL radio). R1 = Meshtastic source
; (owner's MT node @ 906.875); R3 = LoRaWAN 903.9/BW125/SF7 on the CO-PROC; R1
; routes ONLY to R3 (mask 0x04 = bit2). An MT text on R1 -> host encodes ABP with
; the build-flag creds -> MSG_TX over the link -> co-proc R3 transmits. Capture on
; a 3rd board flashed [env:bench_lw_sniffer] (903.9/SF7) and feed its evt=LWRAW
; raw=… + the keys below to tools/lw-verify.py. R3 TX=10 dBm (co-located boards).
; Needs the co-proc on COM-B running [env:xiao_coproc_sx1262]. Throwaway keys.
[env:bench_lw_enc_r3]
platform  = espressif32 @ 6.13.0
board     = seeed_xiao_esp32s3
framework = arduino
lib_deps  = jgromes/RadioLib @ 7.7.0
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DBRIDGE_BENCH_AUTOSAVE
    -DBRIDGE_REGION=1
    -DLORA_RADIO3_ENABLE
    -DLORA_RADIO3_SYNC_WORD=0x34
    -DLORA_RADIO3_FREQUENCY=903.9f
    -DLORA_RADIO3_BANDWIDTH=125.0f
    -DLORA_RADIO3_SPREAD_FACTOR=7
    -DLORA_RADIO3_TX_POWER=10
    -DLORA_RADIO1_ROUTE_MASK=0x04
    ; R1 must carry the LongFast PSK or it can't decrypt the MT text to encode
    ; (the build default BRIDGE_MT_PSK_B64 is empty; the portal normally fills it).
    '-DLORA_RADIO1_CHANNEL_NAME="LongFast"'
    '-DLORA_RADIO1_CHANNEL_KEY="AQ=="'
    -DBRIDGE_LW_ENCODE=1
    -DBRIDGE_LW_ENC_SELFTEST=1
    -DBRIDGE_LW_ENC_DEVADDR=0x01000001u
    -DBRIDGE_LW_ENC_FPORT=13
